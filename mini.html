<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="theme-color" content="#0d0a13"><link rel="icon" href="logo.png">
 <title>DonutSMP · Mini Market Watch</title>
 <style>
 @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
 :root {color-scheme:dark;--text:#f8efff;--muted:#b6a3c6;--violet:#d9b4ff;--mint:#7debbb;--rose:#ff9fb4;font-family:'Space Grotesk','Trebuchet MS',sans-serif}
 *{box-sizing:border-box} body{margin:0;min-width:270px;min-height:100vh;background:#0f0a15;color:var(--text)}
 body:before{content:'';position:fixed;inset:0;z-index:-2;background:url('background.jpg') center/cover;opacity:.09;pointer-events:none}
 body:after{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(160deg,#130e1be8,#0c0912f5);pointer-events:none}
 button:focus-visible,a:focus-visible{outline:2px solid #e0b6ff;outline-offset:3px}
 .head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 18px 16px;border-bottom:1px solid #45324e}
 .brand{display:flex;align-items:center;gap:10px}.brand img{width:39px;height:39px;object-fit:contain;image-rendering:pixelated}.brand strong{display:block;letter-spacing:-.055em;font-size:17px}.brand small{display:block;font:500 9px 'DM Mono',Consolas,monospace;letter-spacing:.08em;color:#bb8fda;margin-top:3px}
 .dot{width:8px;height:8px;background:#a58da8;border-radius:50%;box-shadow:0 0 10px #bf7bef70;flex:none}.dot.ok{background:var(--mint);box-shadow:0 0 10px #6cecaf80}.dot.bad{background:var(--rose);box-shadow:0 0 10px #ee98ad75}
 main{padding:18px;max-width:100%}.label{font:500 10px 'DM Mono',Consolas,monospace;letter-spacing:.12em;color:#c9acd9}
 .price-panel{background:radial-gradient(ellipse at right top,#57296b8c,transparent 56%),linear-gradient(145deg,#23172d,#1a1224);border:1px solid #654276;border-radius:11px;padding:17px 16px 15px}
 #price{font-size:clamp(32px,8.4vw,53px);letter-spacing:-.07em;font-weight:700;margin:7px 0 4px;line-height:1.13;font-variant-numeric:tabular-nums}
 #status{color:#c6accc;font-size:11px;line-height:1.55;min-height:17px}#status.ok{color:var(--mint)}#status.bad{color:var(--rose)}
 .graph-panel{border:1px solid #3b2c47;background:#17111ed9;border-radius:11px;margin-top:13px;padding:15px 11px 12px}
 .graph-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 3px 8px}.graph-head strong{font-size:13px;letter-spacing:-.02em}.graph-head span{font:400 9px 'DM Mono',Consolas,monospace;color:#a08ab3}
 #graph{width:100%;height:155px;display:block}.timing{display:flex;justify-content:space-between;gap:7px;font:400 9px 'DM Mono',Consolas,monospace;color:#877792;padding:3px 5px 0}
 .actions{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-top:15px}
 button{background:#d7b0ff;color:#1c1025;border:0;border-radius:8px;cursor:pointer;padding:11px 13px;font:700 11px 'Space Grotesk',sans-serif}button:hover{background:#ebd0ff}a{color:#e5c4ff;text-decoration:none;font-size:11px;font-weight:600}a:hover{text-decoration:underline;text-underline-offset:3px}
 .bottom{border-top:1px solid #382840;margin-top:19px;padding-top:11px;font:400 10px 'DM Mono',Consolas,monospace;color:#a894b5;line-height:1.55}
 .credit{margin-top:5px;color:#8c7a9c} .credit strong{color:#cab0e6;font-weight:500}
 @media(max-width:335px){.head{padding:12px}main{padding:12px}.graph-panel{padding:12px 5px}.price-panel{padding:12px}}
 </style>
</head>
<body>
 <header class="head"><div class="brand"><img src="logo.png" alt="Elytra" width="39" height="39"><div><strong>DONUTSMP<span style="color:#bb7bef">.</span></strong><small>MINI MARKET WATCH</small></div></div><span id="dot" class="dot" role="status" aria-label="Connecting"></span></header>
 <main>
  <section class="price-panel"><div class="label">LOWEST VERIFIED ELYTRA LISTING</div><div id="price">—</div><div id="status" role="status" aria-live="polite">Connecting to the market…</div></section>
  <section class="graph-panel"><div class="graph-head"><strong>Price movement</strong><label style="font-size:11px;color:#c9acd9">History <select id="historyRange" aria-label="History time range" style="background:#21192c;color:#f6f0ff;border:1px solid #654276;border-radius:6px;padding:6px"><option value="1">1 hour</option><option value="24" selected>24 hours</option></select></label></div><canvas id="graph" role="img" aria-label="History of verified Elytra listing prices, with dollar amounts on left axis"></canvas><div class="timing"><span id="first">—</span><span id="last">—</span></div></section>
  <div class="actions"><button type="button" id="refresh">↻ Check now</button><a href="./" target="_blank" rel="noopener noreferrer">Full dashboard ↗</a></div>
  <div class="bottom"><div id="checked">Last checked: Never</div><div>Auto-checks every 60 seconds · Drag or resize this browser window.</div><div class="credit"><strong>TechyMC</strong> · Credits to Donut.Auction</div></div>
 </main>
 <script src="history.js"></script>
<script>
 'use strict';
 const $=id=>document.getElementById(id),fmt=v=>'$'+(v>=1e9?(v/1e9).toFixed(3)+'B':(v/1e6).toFixed(2)+'M');
 const time=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
 let history=[],busy=false;
 const marketHistory=createMarketHistory([],points=>{history=points;draw();});
 function draw(){const c=$('graph'),r=c.getBoundingClientRect(),w=Math.max(230,r.width),h=Math.max(135,r.height),dpr=Math.min(window.devicePixelRatio||1,2);c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const L=56,R=10,T=13,B=18,plotW=w-L-R,plotH=h-T-B;const vals=history.map(v=>v.p),min=vals.length?Math.min(...vals):390e6,max=vals.length?Math.max(...vals):400e6,pad=Math.max(1.3e6,(max-min)*.20),lo=Math.floor((min-pad)/5e6)*5e6,hi=Math.ceil((max+pad)/5e6)*5e6;const xp=i=>L+plotW*(history[i].t-marketHistory.start())/(marketHistory.end()-marketHistory.start()),yp=p=>T+(hi-p)/(hi-lo)*plotH;
 ctx.font='9px "DM Mono",monospace';ctx.textBaseline='middle';ctx.textAlign='right';for(let val=hi;val>=lo;val-=5e6){const y=yp(val);ctx.strokeStyle='#3d2c4a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(w-R,y);ctx.stroke();ctx.fillStyle='#ad9bbd';ctx.fillText('$'+(val/1e6).toFixed(0)+'M',L-6,y);}if(!history.length){ctx.fillStyle='#ab96bd';ctx.textAlign='center';ctx.font='11px sans-serif';ctx.fillText('Awaiting live prices',L+plotW/2,h/2);$('first').textContent='No verified data';$('last').textContent='';return;}
 const gradient=ctx.createLinearGradient(0,T,0,h-B);gradient.addColorStop(0,'#b674ff55');gradient.addColorStop(1,'#b674ff00');ctx.beginPath();history.forEach((p,i)=>{if(i===0)ctx.moveTo(xp(i),yp(p.p));else ctx.lineTo(xp(i),yp(p.p));});ctx.lineTo(xp(history.length-1),h-B);ctx.lineTo(xp(0),h-B);ctx.closePath();ctx.fillStyle=gradient;ctx.fill();ctx.beginPath();history.forEach((p,i)=>{if(i===0)ctx.moveTo(xp(i),yp(p.p));else ctx.lineTo(xp(i),yp(p.p));});ctx.strokeStyle='#d69aff';ctx.lineJoin='round';ctx.lineWidth=2;ctx.stroke();const point=history[history.length-1];ctx.beginPath();ctx.arc(xp(history.length-1),yp(point.p),3.7,0,2*Math.PI);ctx.fillStyle='#e4baff';ctx.fill();$('first').textContent=time(marketHistory.start());$('last').textContent=time(marketHistory.end());}
 async function check(){if(busy)return;busy=true;$('status').textContent='Checking Donut.Auction…';try{const r=await fetch('/api/price',{cache:'no-store'});if(!r.ok)throw Error('Server returned '+r.status);const d=await r.json();if(d.verified!==true||!Number.isFinite(d.price)||d.price<=0)throw Error(d.error||'Price could not be verified.');$('price').textContent=fmt(d.price);$('status').textContent='● Connected · Price verified';$('status').className='ok';$('dot').className='dot ok';$('dot').setAttribute('aria-label','Connected');marketHistory.record({p:d.price,t:d.checked_at*1000});}catch(e){$('status').textContent='Price not verified: '+e.message;$('status').className='bad';$('dot').className='dot bad';$('dot').setAttribute('aria-label','Price connection failed');}finally{marketHistory.refresh();$('checked').textContent='Last checked: '+new Date().toLocaleTimeString();busy=false;}}
 $('refresh').onclick=check;window.addEventListener('resize',draw);$('historyRange').onchange=e=>marketHistory.setHours(Number(e.target.value));marketHistory.refresh();draw();check();setInterval(check,60000);
 </script>
</body>
</html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DonutSMP • Mini Elytra Tracker</title><link rel="icon" href="logo.png">
<style>
:root{color-scheme:dark;font-family:Arial,'Segoe UI',sans-serif}*{box-sizing:border-box}body{margin:0;min-width:235px;background:#110b19;color:#fff}header{display:flex;align-items:center;gap:10px;background:#1d1428;border-bottom:1px solid #6a3585;padding:12px}header img{width:38px;height:38px;object-fit:contain}header strong{font-family:Georgia,serif;font-size:16px}header small{display:block;color:#ce8cf4;font-size:10px;margin-top:3px}main{padding:14px}.eyebrow{color:#c5acd6;font-weight:bold;font-size:10px;letter-spacing:.09em}.price{background:#e9d3ff;color:#14071d;border-radius:9px;font-size:clamp(25px,7vw,38px);font-weight:900;padding:9px 12px;margin-top:9px}.status{color:#e6b2d4;font-size:11px;margin:8px 0 13px;min-height:14px}.status.ok{color:#66efba}.chart{width:100%;height:130px;border:1px solid #4d335d;background:#1b1426;border-radius:5px;display:block}.bottom{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-top:12px}button{background:#7826ba;color:white;border:0;padding:9px 12px;font-weight:800;font-size:11px;cursor:pointer}button:hover{background:#9c40e5}small{font-size:10px;color:#a998bb}#last{display:block;margin-top:9px}footer{font-size:10px;color:#a998bb;margin-top:10px}a{color:#d6a5ff}
</style></head><body><header><img src="logo.png" alt="Elytra"><div><strong>DONUTSMP</strong><small>MINI ELYTRA TRACKER</small></div></header><main><div class="eyebrow">LATEST VERIFIED ELYTRA PRICE</div><div id="price" class="price">—</div><div id="status" class="status">Checking live price…</div><canvas id="graph" class="chart"></canvas><div class="bottom"><button id="refresh">↻ CHECK NOW</button><a href="./" target="_blank" rel="noopener">Full dashboard ↗</a></div><small id="last">Last checked: Never</small><footer>Auto-check every 60 seconds • Resize or move this browser window using its edges and title bar.</footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const fmt=v=>'$'+(v>=1e9?(v/1e9).toFixed(3)+'B':(v/1e6).toFixed(2)+'M');
let history=[],busy=false;
try{const raw=JSON.parse(localStorage.getItem('elytra_history')||'[]');if(Array.isArray(raw))history=raw.filter(x=>x&&Number.isFinite(x.p)&&Number.isFinite(x.t)).slice(-80)}catch{}
function draw(){const c=$('graph'),r=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),w=Math.max(200,r.width),h=Math.max(100,r.height);c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);x.strokeStyle='#493353';x.fillStyle='#aa98b9';x.font='10px Arial';for(let i=1;i<=3;i++){x.beginPath();x.moveTo(8,i*h/4);x.lineTo(w-8,i*h/4);x.stroke()}if(!history.length){x.fillText('Waiting for verified prices…',15,h/2);return}const a=history.map(v=>v.p),lo=Math.min(...a)-2e6,hi=Math.max(...a)+2e6;const y=p=>12+(hi-p)/(hi-lo)*(h-24);x.strokeStyle='#d979ff';x.lineWidth=2;x.beginPath();history.forEach((p,i)=>{const px=12+i*(w-24)/Math.max(1,history.length-1);if(i)x.lineTo(px,y(p.p));else x.moveTo(px,y(p.p))});x.stroke();x.fillStyle='#eaa2ff';history.forEach((p,i)=>{const px=12+i*(w-24)/Math.max(1,history.length-1);x.beginPath();x.arc(px,y(p.p),2,0,Math.PI*2);x.fill()})}
async function check(){if(busy)return;busy=true;$('status').textContent='Checking Donut.Auction…';try{const r=await fetch('/api/price',{cache:'no-store'});if(!r.ok)throw Error('Server returned '+r.status);const d=await r.json();if(d.verified!==true||!Number.isFinite(d.price)||d.price<=0)throw Error(d.error||'No verified price');$('price').textContent=fmt(d.price);$('status').textContent='● Connected • Price verified';$('status').className='status ok';history.push({p:d.price,t:Date.now()});history=history.slice(-80);try{localStorage.setItem('elytra_history',JSON.stringify(history))}catch{}draw()}catch(e){$('status').textContent='Price not verified: '+e.message;$('status').className='status'}finally{$('last').textContent='Last checked: '+new Date().toLocaleTimeString();busy=false}}
$('refresh').onclick=check;window.addEventListener('resize',draw);window.addEventListener('storage',e=>{if(e.key==='elytra_history'){try{const h=JSON.parse(e.newValue||'[]');if(Array.isArray(h)){history=h.filter(x=>x&&Number.isFinite(x.p)&&Number.isFinite(x.t)).slice(-80);draw()}}catch{}}});draw();check();setInterval(check,60000);
</script></body></html>
